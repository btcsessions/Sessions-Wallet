name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab (e.g. to get a Mac build).
  workflow_dispatch:

env:
  # Keeps target/ small enough for hosted runners.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/wallet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/wallet/package-lock.json
      - run: npm ci
      - run: npm run build

  macos:
    # Apple Silicon .dmg with group messaging. Signed and notarised when the
    # APPLE_* secrets are set; otherwise unsigned (right-click › Open the
    # first time).
    if: github.event_name != 'pull_request'
    # Only the web checks gate it, so a Rust test failure doesn't hold up the app.
    needs: [ui]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            native/marmot-bridge
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Group messaging library (MarmotKit)
        run: scripts/build-marmot-bridge.sh --target aarch64-apple-darwin
      - name: Build the app
        working-directory: apps/wallet
        env:
          BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Unset Apple secrets mean an unsigned (ad-hoc) build: drop the empty
          # variables, or the bundler tries to import an empty certificate.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          npm ci && npx tauri build --target aarch64-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: sessions-wallet-macos-arm64
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  desktop:
    # Unsigned builds for testing. Signing/notarisation comes later.
    if: github.event_name == 'push'
    needs: [rust, ui]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - if: runner.os == 'Linux'
        name: Group messaging library (MarmotKit)
        run: scripts/build-marmot-bridge.sh
      - working-directory: apps/wallet
        run: npm ci && npm run tauri build
        env:
          BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: sessions-wallet-${{ matrix.os }}
          path: target/release/bundle/

  android:
    # Signed arm64 APK (Pixel / GrapheneOS and most modern phones).
    # Needs secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD;
    # without them the APK is unsigned and won't install.
    if: github.event_name == 'push'
    needs: [rust, ui]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "ndk;28.2.13676358" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Group messaging library (MarmotKit for Android)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: scripts/build-marmotkit.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nkeyAlias=sessions-wallet\npassword=%s\n' "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" \
            > apps/wallet/src-tauri/gen/android/keystore.properties
      - working-directory: apps/wallet
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}
        run: npm ci && npx tauri android build --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: sessions-wallet-android
          path: apps/wallet/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
