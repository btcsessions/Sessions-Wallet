[package]
name = "sessions-wallet-app"
description = "Sessions Wallet: a build-your-own bitcoin wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Mobile builds need a library; desktop uses main.rs.
name = "sessions_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
sessions-core.workspace = true
rail-onchain.workspace = true
rail-spark.workspace = true
rail-liquid.workspace = true
rail-ecash.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri = { version = "2.12", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zeroize = "1"
ciborium = "0.2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-bitbox = { path = "plugins/tauri-plugin-bitbox" }
tauri-plugin-jade = { path = "plugins/tauri-plugin-jade" }
async-trait.workspace = true
bitcoin.workspace = true
# BitBox02. USB (hidapi) on desktop only; Android goes through the plugin + nusb.
bitbox-api = { version = "0.13", features = ["tokio", "multithreaded"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
bitbox-api = { version = "0.13", features = ["usb"] }
# The same hidapi bitbox-api uses, to find the device and explain open errors.
hidapi = "2.3"
# Jade over Bluetooth LE on desktop. Android goes through tauri-plugin-jade.
btleplug = "0.13"
futures-util = "0.3"
uuid = "1"

[target.'cfg(target_os = "android")'.dependencies]
nusb = "0.2.8"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[dev-dependencies]
tempfile = "3"
