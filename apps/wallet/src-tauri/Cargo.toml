[package]
name = "sessions-wallet-app"
description = "Sessions Wallet: a build-your-own bitcoin wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Mobile builds need a library; desktop uses main.rs.
name = "sessions_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
sessions-core.workspace = true
rail-onchain.workspace = true
rail-spark.workspace = true
rail-liquid.workspace = true
rail-ecash.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri = { version = "2.12", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
