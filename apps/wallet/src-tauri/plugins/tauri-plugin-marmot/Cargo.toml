[package]
name = "tauri-plugin-marmot"
description = "Group vault messaging (Marmot / MLS over Nostr) for Sessions Wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
# Lets tauri-build find the Android library under android/.
links = "tauri-plugin-marmot"

[dependencies]
tauri = { version = "2.12", default-features = false }
serde.workspace = true
serde_json.workspace = true


[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
