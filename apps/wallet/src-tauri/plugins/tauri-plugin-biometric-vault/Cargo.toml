[package]
name = "tauri-plugin-biometric-vault"
description = "Fingerprint / face unlock for Sessions Wallet: the passcode sealed under a biometric-bound Android Keystore key"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
# Lets tauri-build find the Android library under android/.
links = "tauri-plugin-biometric-vault"

[dependencies]
tauri = { version = "2.12", default-features = false }
serde.workspace = true
serde_json.workspace = true
zeroize = "1"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
