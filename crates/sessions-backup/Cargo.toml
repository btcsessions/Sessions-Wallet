[package]
name = "sessions-backup"
description = "Passkey wallet keys and the encrypted wallet-state backup on Nostr relays for Sessions Wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sessions-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
bitcoin.workspace = true
base64 = "0.22"
chacha20poly1305 = "0.10"
flate2 = "1"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = "1"
futures-util = "0.3"
# Same TLS stack as the rest of the app: rustls (ring) + bundled web roots,
# so it builds for Android without the platform trust store or aws-lc.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread"] }
