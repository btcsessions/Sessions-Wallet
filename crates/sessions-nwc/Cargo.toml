[package]
name = "sessions-nwc"
description = "Nostr Wallet Connect (NIP-47) wallet service for Sessions Wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sessions-backup.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
bitcoin.workspace = true
tokio = { workspace = true, features = ["net", "rt"] }
base64 = "0.22"
chacha20 = "0.9"
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
rand = "0.8"
zeroize = "1"
futures-util = "0.3"
# BOLT11 decoding for budget checks (amount, payment hash), already in the
# lock through the Lightning stack.
lightning-invoice = "0.34"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread"] }
