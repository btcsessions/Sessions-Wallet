[package]
name = "rail-onchain"
description = "On-chain bitcoin accounts for Sessions Wallet: single-sig, multisig, hardware and watch-only (BDK)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sessions-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
bdk_wallet = { version = "3.2", features = ["file_store"] }
bdk_esplora = { version = "0.22", default-features = false, features = ["std", "async-https-rustls"] }
# Pulled in directly only to enable its tokio sleeper (needed for build_async).
esplora-client = { version = "0.12", default-features = false, features = ["async-https-rustls", "tokio"] }
# Payjoin: BIP78 (v1) and BIP77 (v2, async via directory + OHTTP relays).
# Uses the same `bitcoin` 0.32 as bdk_wallet, so types interoperate directly.
payjoin = { version = "1.2", default-features = false, features = ["v1", "v2", "io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Electrum protocol (the default chain backend): batched requests over one
# persistent connection. No TLS feature: we bring our own rustls (ring) stream
# (its rustls features pull in aws-lc, which we avoid for Android).
bdk_electrum = { version = "0.24", default-features = false }
# Push notifications (new blocks, payments) over a second, async Electrum
# connection: tokio + rustls (ring) + bundled roots, like the rest of the app.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"


[dev-dependencies]
tempfile = "3"
