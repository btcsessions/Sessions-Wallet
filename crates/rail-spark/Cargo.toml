[package]
name = "rail-spark"
description = "Spark / Lightning spending account for Sessions Wallet, built on the Breez SDK - Spark"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sessions-core = { workspace = true }
# The app's Electrum connection, as the SDK's chain backend.
rail-onchain = { workspace = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
bip39.workspace = true
bitcoin.workspace = true
# Pinned to the 0.26.1 release tag. `sqlite` gives the SDK's built-in file
# storage under `storage_dir`.
breez-sdk-spark = { git = "https://github.com/breez/spark-sdk", tag = "0.26.1", default-features = false, features = ["sqlite"] }
uuid = { version = "1", features = ["v4"] }
# The Spending account behind Nostr Wallet Connect.
sessions-nwc.workspace = true

[dev-dependencies]
tempfile = "3"
